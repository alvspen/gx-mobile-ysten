# .github/workflows/update-m3u-github-pages.yml

name: Update M3U Playlist

on:
  schedule:
    - cron: "0 */6 * * *" # 每6小时
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate M3U
        run: python json_to_m3u.py
      - name: Prepare dist
        run: |
          mkdir -p dist
          cp channels.m3u dist/
          echo "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>IPTV</title></head><body><h1>IPTV Playlist</h1><p>Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')</p><a href=\"channels.m3u\">Download</a></body></html>" > dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Commit M3U
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add channels.m3u
          git diff --staged --quiet || git commit -m "Update M3U - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
