# .github/workflows/update-m3u-edgeone.yml

name: Update M3U & Deploy to EdgeOne Pages

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate M3U
        run: python json_to_m3u.py
      - name: Prepare dist
        run: |
          mkdir -p dist
          cp channels.m3u dist/
          echo "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>IPTV</title></head><body><h1>IPTV Playlist</h1><p>Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')</p><a href=\"channels.m3u\">Download</a></body></html>" > dist/index.html
